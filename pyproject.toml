[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warbucks"
version = "0.1.0"
description = "Local cross-model chat context bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
warbucks = "warbucks.cli:main"

[tool.setuptools.packages.find]
include = ["warbucks*"]
